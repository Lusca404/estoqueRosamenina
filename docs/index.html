<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosamenina · Estoque e vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login">
  <form id="login-form" class="login-card">
    <h1 class="logo">Rosamenina</h1>
    <p class="muted">Entre para gerenciar estoque e vendas.</p>
    <label>E-mail<input type="email" id="email" required autocomplete="username"></label>
    <label>Senha<input type="password" id="senha" required autocomplete="current-password"></label>
    <p id="login-erro" class="erro" hidden></p>
    <button class="btn" type="submit">Entrar</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="topo">
    <button class="logo logo-btn" data-ir="home" aria-label="Voltar ao início">Rosamenina</button>
    <div class="usuario"><span id="usuario-nome"></span><button id="sair" class="btn-link">Sair</button></div>
  </header>

  <main>
    <!-- INÍCIO -->
    <section id="aba-home" class="painel-home">
      <h2 class="ola">Olá, <span id="ola-nome"></span>! O que vamos fazer?</h2>
      <div class="menu">
        <button class="cartao" data-ir="venda">
          <span class="icone">🛍️</span>
          <b>Registrar venda</b>
          <small>Lançar uma venda nova e dar baixa no estoque</small>
        </button>
        <button class="cartao" data-ir="produtos">
          <span class="icone">🎀</span>
          <b>Produtos</b>
          <small id="info-produtos">Cadastrar e controlar o estoque</small>
        </button>
        <button class="cartao" data-ir="historico">
          <span class="icone">🧾</span>
          <b>Vendas realizadas</b>
          <small id="info-vendas">Ver quem vendeu, como e onde</small>
        </button>
      </div>
    </section>
    <!-- VENDA -->
    <section id="aba-venda" class="painel" hidden>
      <button class="voltar" data-ir="home">← Início</button>
      <h2>Registrar venda</h2>
      <form id="venda-form" class="grade">
        <label class="largo">Produto
          <select id="v-produto" required></select>
        </label>
        <label>Quantidade<input type="number" id="v-qtd" min="1" value="1" required></label>
        <label>Total<input type="text" id="v-total" readonly></label>

        <fieldset class="largo">
          <legend>Forma de pagamento</legend>
          <div class="chips" id="v-pagamento">
            <label><input type="radio" name="pag" value="Pix" required><span>Pix</span></label>
            <label><input type="radio" name="pag" value="Crédito"><span>Crédito</span></label>
            <label><input type="radio" name="pag" value="Débito"><span>Débito</span></label>
            <label><input type="radio" name="pag" value="Dinheiro"><span>Dinheiro</span></label>
            <label><input type="radio" name="pag" value="Pagamento tardio"><span>Pagamento tardio</span></label>
          </div>
        </fieldset>

        <fieldset class="largo">
          <legend>Unidade</legend>
          <div class="chips">
            <label><input type="radio" name="unid" value="Guamá" required><span>Guamá</span></label>
            <label><input type="radio" name="unid" value="Guanabara"><span>Guanabara</span></label>
            <label><input type="radio" name="unid" value="Não se aplica"><span>Não se aplica</span></label>
          </div>
        </fieldset>

        <label class="largo">Observação (opcional)<input type="text" id="v-obs" placeholder="Ex.: nome da cliente, combinado de pagamento"></label>
        <button class="btn largo" type="submit">Registrar venda</button>
      </form>
    </section>

    <!-- PRODUTOS -->
    <section id="aba-produtos" class="painel" hidden>
      <button class="voltar" data-ir="home">← Início</button>
      <h2>Produtos</h2>
      <div class="resumo">
        <div class="stat"><small>Produtos cadastrados</small><b id="r-total">0</b></div>
        <div class="stat"><small>Peças em estoque</small><b id="r-pecas">0</b></div>
        <div class="stat"><small>Valor em estoque</small><b id="r-valor">R$ 0,00</b></div>
        <div class="stat atencao"><small>Estoque baixo</small><b id="r-baixo">0</b></div>
        <div class="stat atencao"><small>Esgotados</small><b id="r-zero">0</b></div>
      </div>
      <form id="produto-form" class="grade tres">
        <label class="largo">Nome<input type="text" id="p-nome" required></label>
        <label>Preço (R$)<input type="number" id="p-preco" step="0.01" min="0" required></label>
        <label>Valor no crédito (R$)<input type="number" id="p-credito" step="0.01" min="0" required></label>
        <label>Estoque<input type="number" id="p-qtd" min="0" required></label>
        <label class="largo">Descrição<textarea id="p-desc" rows="2" placeholder="Ex.: tamanho, cor, material, marca"></textarea></label>
        <button class="btn largo" type="submit">Adicionar produto</button>
      </form>
      <input type="search" id="busca" class="busca" placeholder="Buscar produto">
      <div id="lista-produtos" class="lista"></div>
    </section>

    <!-- HISTÓRICO -->
    <section id="aba-historico" class="painel" hidden>
      <button class="voltar" data-ir="home">← Início</button>
      <h2>Vendas realizadas</h2>
      <div id="lista-vendas" class="lista"></div>
    </section>
  </main>
</div>

<div id="aviso" class="aviso" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
